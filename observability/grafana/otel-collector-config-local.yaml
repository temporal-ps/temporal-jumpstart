# OpenTelemetry Collector Configuration for Local Prometheus
# This collector scrapes Prometheus metrics from Temporal .NET SDK and forwards to local Prometheus

receivers:
  # Scrape Prometheus metrics from the Temporal .NET worker(s)
  # To add more workers, add additional targets below
  prometheus:
    config:
      scrape_configs:
        - job_name: 'temporal-cloud'
          scrape_interval: 60s
          scrape_timeout: 30s
          honor_timestamps: true
          scheme: https
          authorization:
            type: Bearer
            credentials: '${TEMPORAL_CLOUD_API_KEY}'
          static_configs:
            - targets: ['metrics.temporal.io']
          metrics_path: '/v1/metrics'
        # Spring Boot apps with Actuator.
        # Targets are the management.server.port values that
        # fde-temporal-oms scripts/local-up.sh passes to each service.
        # The workshop v2 workers (9083, 9093) are only up during the
        # safe-fulfillment-handoff workshop and report down otherwise.
        - job_name: 'temporal-worker-spring'
          scrape_interval: 15s
          metrics_path: '/actuator/prometheus'
          static_configs:
            - targets: [ 'host.docker.internal:9091' ]
              labels:
                service: 'apps-api'
                environment: 'local'
            - targets: ['host.docker.internal:9092']
              labels:
                service: 'apps-worker'
                environment: 'local'
                worker_instance: 'apps-worker-1'
            - targets: ['host.docker.internal:9093']
              labels:
                service: 'apps-worker'
                environment: 'local'
                worker_instance: 'apps-worker-v2'
            - targets: [ 'host.docker.internal:9081' ]
              labels:
                service: 'processing-api'
                environment: 'local'
            - targets: [ 'host.docker.internal:9082' ]
              labels:
                service: 'processing-worker'
                environment: 'local'
                worker_instance: 'processing-worker-1'
            - targets: [ 'host.docker.internal:9083' ]
              labels:
                service: 'processing-worker'
                environment: 'local'
                worker_instance: 'processing-worker-v2'
            - targets: [ 'host.docker.internal:9071' ]
              labels:
                service: 'fulfillment-api'
                environment: 'local'
            - targets: [ 'host.docker.internal:9072' ]
              labels:
                service: 'fulfillment-worker'
                environment: 'local'
                worker_instance: 'fulfillment-worker-1'
            - targets: [ 'host.docker.internal:9050' ]
              labels:
                service: 'enablements-api'
                environment: 'local'
            - targets: [ 'host.docker.internal:9052' ]
              labels:
                service: 'enablements-worker'
                environment: 'local'
                worker_instance: 'enablements-worker-1'
        # Non-Spring apps with standard /metrics endpoint
        - job_name: 'temporal-worker-standard'
          scrape_interval: 15s
          metrics_path: '/metrics'
          static_configs:
            - targets: ['host.docker.internal:9464']
              labels:
                service: 'temporal-worker'
                environment: 'local'
                worker_instance: 'worker-2'

  # OTLP push from apps that export directly (fde-temporal-oms apps-api and
  # apps-workers push to localhost:4317 via ObservabilityConfig).
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Add batch processing to reduce network calls
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Add resource attributes for better filtering in Grafana
  # service.name is left as set by each receiver: the scrape job_name for
  # prometheus targets, the app-reported name for OTLP. Prometheus remote
  # write maps it to the `job` label, so overriding it here collapses every
  # app into one job.
  resource:
    attributes:
      - key: deployment.environment
        from_attribute: environment
        action: upsert

exporters:
  # Send to local Prometheus using Remote Write
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    # No auth needed for local Prometheus
    timeout: 30s

  # Optional: also export to local console for debugging
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

  # Sink for OTLP traces; there is no local trace backend.
  debug/traces:
    verbosity: basic

service:
  # Bind the collector's own metrics on all interfaces so the Prometheus
  # container can scrape otel-collector-local:8888.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      processors: [batch, resource]
      exporters: [prometheusremotewrite]
      # Uncomment to also log metrics for debugging:
      # exporters: [prometheusremotewrite, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/traces]
